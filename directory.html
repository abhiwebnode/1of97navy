<!-- Directory Section -->
<div class="container py-5">

<!-- Scripts -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="lib/wow/wow.js"></script>

<script>
// ── Google Sheet CSV URL ──────────────────────────────────────────────
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTbYF4OsWbMY0NfKvUYTyM0soo2ZZlD9OtC3w77RlINBT7BfyRHv7EK4iVTcqdwzPjfH9epRa8rEeWQ/pub?gid=1459106869&single=true&output=csv';

// ── Column name mapping ───────────────────────────────────────────────
const FIELD = {
    name:     'Full Name',
    rank:     'Last Rank',
    trade:    'Trade / Branch',
    ship:     'Last Ship / Establishment',
    city:     'Current City',
    state:    'Current State',
    status:   'Status',
    photo:    'Your Photo',
    note:     "Anything you'd like to add?",
    phone:    'Phone/Mobile Number (If Feeded it will be Shown to Public)',
    email:    'Email ID   (If Feeded it will be Shown to Public)',
    division: 'Division at INS Chilka'
};

// ── State ─────────────────────────────────────────────────────────────
let allMembers = [];
let COL = {};

// ── Parse CSV ─────────────────────────────────────────────────────────
function parseCSV(text) {
    const lines = text.trim().split('\n');
    if (lines.length < 2) return [];

    const headers = parseCSVLine(lines[0]);
    Object.keys(FIELD).forEach(key => {
        COL[key] = headers.findIndex(h => h.trim() === FIELD[key]);
    });

    return lines.slice(1)
        .filter(line => line.trim())
        .map((line, i) => {
            const cols = parseCSVLine(line);
            const get  = key => COL[key] >= 0 ? (cols[COL[key]] || '').trim() : '';
            return {
                id:       i + 1,
                name:     get('name'),
                rank:     get('rank'),
                trade:    get('trade'),
                ship:     get('ship'),
                city:     get('city'),
                state:    get('state'),
                status:   get('status') || 'Retired',
                photo:    convertDriveUrl(get('photo')),
                note:     get('note'),
                phone:    get('phone'),
                email:    get('email'),
                division: get('division')
            };
        })
        .filter(m => m.name);
}

function parseCSVLine(line) {
    const result = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
            inQuotes = !inQuotes;
        } else if (ch === ',' && !inQuotes) {
            result.push(current);
            current = '';
        } else {
            current += ch;
        }
    }
    result.push(current);
    return result;
}

// ── Convert Google Drive URL → embeddable thumbnail ───────────────────
function convertDriveUrl(url) {
    if (!url) return '';
    let match = url.match(/[?&]id=([^&]+)/);
    if (match) return `https://lh3.googleusercontent.com/d/${match[1]}`;
    match = url.match(/\/d\/([^\/]+)/);
    if (match) return `https://lh3.googleusercontent.com/d/${match[1]}`;
    return url;
}

// ── Populate Trade filter dynamically ────────────────────────────────
function populateTradeFilter(members) {
    const trades = [...new Set(members.map(m => m.trade).filter(Boolean))].sort();
    const sel = document.getElementById('filter-trade');
    trades.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = t;
        sel.appendChild(opt);
    });
}

// ── Populate Division filter dynamically ──────────────────────────────
function populateDivisionFilter(members) {
    const divisions = [...new Set(members.map(m => m.division).filter(Boolean))].sort();
    const sel = document.getElementById('filter-division');
    divisions.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = d + ' Division';
        sel.appendChild(opt);
    });
}

// ── Render Cards ──────────────────────────────────────────────────────
function renderCards(members) {
    const grid  = document.getElementById('directory-grid');
    const count = document.getElementById('results-count');

    if (members.length === 0) {
        grid.innerHTML = `
            <div class="col-12 text-center py-5">
                <i class="fa fa-search fa-3x mb-3 d-block" style="color:#dde3ef;"></i>
                <h5 class="text-muted">No shipmates found</h5>
                <p class="small text-muted">Try a different search or clear the filters.</p>
            </div>`;
        count.innerHTML = '<strong>0</strong> members found';
        return;
    }

    count.innerHTML = `Showing <strong>${members.length}</strong> of <strong>${allMembers.length}</strong> members`;

    grid.innerHTML = members.map(m => {
        const initials   = m.name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
        const statusClass = m.status === 'Serving' ? 'status-serving' : 'status-retired';

        const photoEl = m.photo
            ? `<img class="member-photo" src="${m.photo}" alt="${m.name}"
                    onerror="this.outerHTML='<div class=member-initials>${initials}</div>'">`
            : `<div class="member-initials">${initials}</div>`;

        const divisionEl = m.division
            ? `<div class="detail-row">
                   <i class="fa fa-flag"></i>
                   <span>${m.division} Division</span>
               </div>` : '';

        const noteEl = m.note
            ? `<div class="detail-row mt-1">
                   <i class="fa fa-quote-left"></i>
                   <span class="fst-italic" style="font-size:.75rem;color:#888;">${m.note}</span>
               </div>` : '';

        const phoneEl = m.phone
            ? `<div class="detail-row">
                   <i class="fa fa-phone"></i>
                   <a href="tel:${m.phone}" style="color:#666;text-decoration:none;">${m.phone}</a>
               </div>` : '';

        const emailEl = m.email
            ? `<div class="detail-row">
                   <i class="fa fa-envelope"></i>
                   <a href="mailto:${m.email}" style="color:#666;text-decoration:none;font-size:.75rem;word-break:break-all;">${m.email}</a>
               </div>` : '';

        const contactDivider = (m.phone || m.email)
            ? `<div style="border-top:1px dashed #f0f3fa;margin:.4rem 0;"></div>` : '';

        return `
        <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
            <div class="member-card">
                <div class="card-top">
                    ${photoEl}
                    <div class="member-info" style="flex:1;min-width:0;">
                        <div class="member-name">${m.name}</div>
                        <div class="member-rank">${m.rank}</div>
                        <span class="status-badge ${statusClass}">${m.status}</span>
                    </div>
                </div>
                <div class="card-details">
                    <div class="detail-row">
                        <i class="fa fa-ship"></i>
                        <span>${m.ship}</span>
                    </div>
                    <div class="detail-row">
                        <i class="fa fa-map-marker-alt"></i>
                        <span>${m.city}, ${m.state}</span>
                    </div>
                    <div class="detail-row">
                        <i class="fa fa-tools"></i>
                        <span class="trade-pill">${m.trade}</span>
                    </div>
                    ${divisionEl}
                    ${noteEl}
                    ${contactDivider}
                    ${phoneEl}
                    ${emailEl}
                </div>
            </div>
        </div>`;
    }).join('');
}

// ── Filter ────────────────────────────────────────────────────────────
function applyFilters() {
    const query    = document.getElementById('search-input').value.toLowerCase().trim();
    const trade    = document.getElementById('filter-trade').value;
    const status   = document.getElementById('filter-status').value;
    const division = document.getElementById('filter-division').value;

    const filtered = allMembers.filter(m => {
        const matchSearch   = !query || [m.name, m.ship, m.city, m.state, m.trade, m.rank, m.division]
            .some(f => f && f.toLowerCase().includes(query));
        const matchTrade    = !trade    || m.trade    === trade;
        const matchStatus   = !status   || m.status   === status;
        const matchDivision = !division || m.division === division;
        return matchSearch && matchTrade && matchStatus && matchDivision;
    });

    renderCards(filtered);
}

// ── Fetch & Init ──────────────────────────────────────────────────────
async function loadMembers() {
    try {
        const res  = await fetch(CSV_URL);
        const text = await res.text();
        allMembers = parseCSV(text);

        document.getElementById('total-badge').textContent =
            `${allMembers.length} member${allMembers.length !== 1 ? 's' : ''} in directory`;

        populateTradeFilter(allMembers);
        populateDivisionFilter(allMembers);
        applyFilters();

    } catch(e) {
        document.getElementById('directory-grid').innerHTML = `
            <div class="col-12 text-center py-5">
                <i class="fa fa-exclamation-circle fa-3x mb-3 d-block" style="color:#dde3ef;"></i>
                <h5 class="text-muted">Could not load member data</h5>
                <p class="small text-muted">Please try refreshing the page.</p>
            </div>`;
        document.getElementById('total-badge').textContent = 'Error loading data';
    }
}

// ── Event Listeners ───────────────────────────────────────────────────
document.getElementById('clear-btn').addEventListener('click', () => {
    document.getElementById('search-input').value    = '';
    document.getElementById('filter-trade').value    = '';
    document.getElementById('filter-status').value   = '';
    document.getElementById('filter-division').value = '';
    applyFilters();
});
document.getElementById('search-input').addEventListener('input',  applyFilters);
document.getElementById('filter-trade').addEventListener('change', applyFilters);
document.getElementById('filter-status').addEventListener('change', applyFilters);
document.getElementById('filter-division').addEventListener('change', applyFilters);

loadMembers();
</script>
