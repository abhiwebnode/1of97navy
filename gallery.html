<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery — Indian Navy 1/97 Batch</title>
    <meta name="description" content="Explore photographic memories of the Indian Navy 1/97 Batch — training days at INS Chilka, life aboard warships, deployments, reunions, and community service.">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="1/97 Batch — Indian Navy Veterans">
    <meta property="og:title" content="Photo Gallery — Indian Navy 1/97 Batch">
    <meta property="og:description" content="Explore photographic memories of the Indian Navy 1/97 Batch — training days at INS Chilka, life aboard warships, deployments, reunions, and community service.">
    <meta property="og:image" content="https://www.1of97navy.in/img/og-image.jpg">
    <meta property="og:locale" content="en_IN">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@1of97navy">
    <meta name="twitter:title" content="Photo Gallery — Indian Navy 1/97 Batch">
    <meta name="twitter:description" content="Explore photographic memories of the Indian Navy 1/97 Batch — training days at INS Chilka, life aboard warships, deployments, reunions, and community service.">
    <meta name="twitter:image" content="https://www.1of97navy.in/img/og-image.jpg">

    <!-- Consolidated Stylesheet -->
    <link href="css/all.css" rel="stylesheet">

    <!-- Page-Specific Styles -->
    <style>
        /* ── Album Cards ── */
        .album-card {
            border: none;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 16px rgba(27,58,107,.08);
            transition: .3s;
            cursor: pointer;
            position: relative;
        }
        .album-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(27,58,107,.16); }
        .album-thumb {
            height: 200px;
            object-fit: cover;
            width: 100%;
            display: block;
        }
        .album-thumb-placeholder {
            height: 200px;
            background: linear-gradient(135deg, var(--primary), #2952A3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: rgba(255,255,255,.3);
        }
        .album-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: linear-gradient(to top, rgba(11,30,61,.92) 0%, transparent 100%);
            padding: 2rem 1rem .9rem;
        }
        .album-title { color: #fff; font-family: 'Saira', sans-serif; font-weight: 700; font-size: 1rem; margin-bottom: .2rem; }
        .album-desc  { color: rgba(255,255,255,.65); font-size: .75rem; margin-bottom: .4rem; }
        .album-count-badge {
            display: inline-block;
            font-size: .65rem; font-weight: 700;
            padding: .15rem .5rem; border-radius: 10px;
        }
        .badge-loaded { background: var(--gold); color: var(--dark); }
        .badge-empty  { background: rgba(255,255,255,.15); color: rgba(255,255,255,.5); }
        .badge-loading { background: rgba(255,255,255,.1); color: rgba(255,255,255,.4); }

        /* ── Photo Grid ── */
        .back-bar {
            display: flex; align-items: center; gap: .75rem;
            padding: .75rem 0; margin-bottom: 1rem;
            border-bottom: 2px solid var(--secondary);
            flex-wrap: wrap;
        }
        .back-btn {
            background: none; border: none; color: var(--primary);
            font-size: .85rem; font-weight: 600; cursor: pointer; padding: 0;
            display: flex; align-items: center; gap: .4rem;
        }
        .back-btn:hover { color: var(--gold); }
        .back-bar-title { font-family: 'Saira', sans-serif; font-weight: 700; color: var(--dark); font-size: 1.1rem; }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: .75rem;
        }
        .photo-item {
            position: relative; aspect-ratio: 4/3;
            overflow: hidden; border-radius: 6px;
            cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.1);
        }
        .photo-item img { width: 100%; height: 100%; object-fit: cover; transition: .3s; }
        .photo-item:hover img { transform: scale(1.06); }
        .photo-item-overlay {
            position: absolute; inset: 0;
            background: rgba(11,30,61,.5);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: .2s;
        }
        .photo-item:hover .photo-item-overlay { opacity: 1; }
        .photo-item-overlay i { color: #fff; font-size: 1.5rem; }

        /* ── Lightbox ── */
        .lb-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,.96);
            z-index: 9999; display: none; flex-direction: column;
        }
        .lb-overlay.active { display: flex; }
        .lb-header {
            display: flex; align-items: center;
            justify-content: space-between;
            padding: .75rem 1.25rem;
            background: rgba(0,0,0,.5); flex-shrink: 0;
        }
        .lb-album-name { color: var(--gold); font-family: 'Saira', sans-serif; font-size: .95rem; font-weight: 700; }
        .lb-counter    { color: rgba(255,255,255,.5); font-size: .8rem; }
        .lb-close {
            background: none; border: none; color: #fff;
            font-size: 1.5rem; cursor: pointer; padding: 0 .5rem;
            opacity: .7; transition: .2s; line-height: 1;
        }
        .lb-close:hover { opacity: 1; color: var(--gold); }
        .lb-body {
            flex: 1; display: flex; align-items: center;
            justify-content: center; position: relative; overflow: hidden;
        }
        .lb-img {
            max-width: 92%; max-height: calc(100vh - 140px);
            object-fit: contain; border-radius: 4px;
            box-shadow: 0 8px 40px rgba(0,0,0,.6); transition: opacity .2s;
        }
        .lb-nav {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(255,255,255,.1); border: none;
            color: #fff; font-size: 1.4rem;
            width: 48px; height: 48px; border-radius: 50%;
            cursor: pointer; transition: .2s;
            display: flex; align-items: center; justify-content: center;
        }
        .lb-nav:hover { background: var(--gold); color: var(--dark); }
        .lb-prev { left: .75rem; }
        .lb-next { right: .75rem; }
        .lb-thumbs {
            display: flex; gap: 6px;
            padding: .5rem 1rem; overflow-x: auto;
            background: rgba(0,0,0,.4); flex-shrink: 0;
            scrollbar-width: thin; scrollbar-color: var(--gold) transparent;
        }
        .lb-thumb-item {
            width: 52px; height: 40px; object-fit: cover;
            border-radius: 3px; cursor: pointer;
            opacity: .5; transition: .2s; flex-shrink: 0;
            border: 2px solid transparent;
        }
        .lb-thumb-item.active, .lb-thumb-item:hover { opacity: 1; border-color: var(--gold); }

        /* ── Spinner ── */
        .mini-spinner {
            width: 28px; height: 28px;
            border: 3px solid #eee; border-top-color: var(--primary);
            border-radius: 50%; animation: sp .7s linear infinite;
            margin: 2rem auto;
        }
        @keyframes sp { to { transform: rotate(360deg); } }

        @media (max-width: 576px) {
            .photo-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: .5rem; }
            .lb-nav { width: 38px; height: 38px; font-size: 1.1rem; }
            .lb-thumb-item { width: 40px; height: 32px; }
        }
    </style>

    <!-- Global Head Injector -->
    <script src="js/header.js"></script>
</head>
<body data-page="memories">

<div id="spinner" class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
    <div class="spinner-grow text-primary" role="status"></div>
</div>

<!-- Navbar -->
<div id="nav-placeholder"></div>
<script src="js/nav.js"></script>

<!-- Page Header -->
<div class="page-header text-center text-white wow fadeIn">
    <div class="container">
        <span class="hero-badge">1/97 Batch · Memories</span>
        <h1 class="display-5 mt-2 mb-3" id="page-title">Photo Gallery</h1>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb justify-content-center mb-0">
                <li class="breadcrumb-item"><a href="index.html" class="text-white-50">Home</a></li>
                <li class="breadcrumb-item active text-white" id="breadcrumb-label">Gallery</li>
            </ol>
        </nav>
    </div>
</div>

<!-- Gallery Section -->
<div class="container py-5">

    <!-- Album Index View -->
    <div id="view-albums">
        <div class="text-center mb-5">
            <span class="section-eyebrow">Our Memories</span>
            <h2 class="section-title h4 mb-0">Photographs from the 1/97 Batch</h2>
            <div class="section-divider mt-3"></div>
            <p class="text-muted mt-3 mb-0" style="max-width:560px;margin:0 auto !important;">
                Click any album to browse photos. Images are loaded live from our media library.
            </p>
        </div>
        <div class="row g-4" id="albums-grid">
            <!-- Rendered by JS -->
        </div>
    </div>

    <!-- Single Album View -->
    <div id="view-photos" style="display:none;">
        <div class="back-bar">
            <button class="back-btn" id="back-btn">
                <i class="fa fa-arrow-left"></i> All Albums
            </button>
            <span style="color:#ddd;">|</span>
            <span class="back-bar-title" id="album-view-title"></span>
            <span class="ms-2 album-count-badge badge-loaded" id="album-view-count"></span>
        </div>
        <p class="text-muted small mb-4" id="album-view-desc"></p>
        <div class="photo-grid" id="photos-grid"></div>
    </div>

</div>

<!-- Lightbox -->
<div class="lb-overlay" id="lightbox">
    <div class="lb-header">
        <div class="lb-album-name" id="lb-album-name"></div>
        <div class="lb-counter"    id="lb-counter"></div>
        <button class="lb-close"   id="lb-close"><i class="fa fa-times"></i></button>
    </div>
    <div class="lb-body">
        <button class="lb-nav lb-prev" id="lb-prev"><i class="fa fa-chevron-left"></i></button>
        <img src="" alt="" class="lb-img" id="lb-img">
        <button class="lb-nav lb-next" id="lb-next"><i class="fa fa-chevron-right"></i></button>
    </div>
    <div class="lb-thumbs" id="lb-thumbs"></div>
</div>

<!-- Footer -->
<div id="footer-placeholder"></div>
<script src="js/footer.js"></script>

<!-- Scripts -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="lib/wow/wow.js"></script>
<script src="lib/easing/easing.min.js"></script>
<script src="lib/waypoints/waypoints.min.js"></script>
<script src="js/main.js"></script>

<script>
// ══════════════════════════════════════════════════════════════════════
// CONFIGURATION — edit here only
// ══════════════════════════════════════════════════════════════════════
const CLOUD_NAME = 'y1x8pb8j';

const ALBUMS = [
    {
        id:          'charity',
        tag:         'charity',
        title:       'Charity & Community Work',
        description: '1/97 Batch veterans giving back to society',
        icon:        'fa-hands-helping'
    },
    {
        id:          'training',
        tag:         'training',
        title:       'Training Days — INS Chilka 1997',
        description: 'Where it all began — basic training memories',
        icon:        'fa-graduation-cap'
    },
    {
        id:          'ships',
        tag:         'ships',
        title:       'Ships & Deployments',
        description: 'Life at sea across the Indian Ocean',
        icon:        'fa-ship'
    },
    {
        id:          'reunions',
        tag:         'reunions',
        title:       'Reunions',
        description: 'Coming back together — batch reunion photographs',
        icon:        'fa-users'
    },
    {
        id:          'social-work',
        tag:         'social-work',
        title:       'Social Work',
        description: 'Regional group activities and community service',
        icon:        'fa-heart'
    },
    {
        id:          'personal',
        tag:         'personal',
        title:       'Personal Memories',
        description: 'Moments shared by batchmates',
        icon:        'fa-camera'
    }
];
// ══════════════════════════════════════════════════════════════════════

let currentAlbum  = null;
let lbIndex       = 0;
const photoCache  = {};

function thumbUrl(img) {
    const v = img.version ? `v${img.version}/` : '';
    return `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/w_450,h_300,c_fill,f_auto,q_auto/${v}${img.public_id}.${img.format}`;
}
function fullUrl(img) {
    const v = img.version ? `v${img.version}/` : '';
    return `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/w_1600,c_limit,f_auto,q_auto/${v}${img.public_id}.${img.format}`;
}

async function fetchTag(tag) {
    if (photoCache[tag]) return photoCache[tag];
    const url = `https://res.cloudinary.com/${CLOUD_NAME}/image/list/${tag}.json`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`Tag fetch failed (${res.status}). Enable Resource list in Cloudinary Security Settings.`);
    const data = await res.json();
    photoCache[tag] = data.resources || [];
    return photoCache[tag];
}

async function renderAlbums() {
    const grid = document.getElementById('albums-grid');

    grid.innerHTML = ALBUMS.map(album => `
        <div class="col-12 col-sm-6 col-lg-4">
            <div class="album-card" id="card-${album.id}"
                 onclick="openAlbum('${album.id}')">
                <div class="album-thumb-placeholder" id="thumb-${album.id}">
                    <i class="fa ${album.icon}"></i>
                </div>
                <div class="album-overlay">
                    <div class="album-title">${album.title}</div>
                    <div class="album-desc">${album.description}</div>
                    <span class="album-count-badge badge-loading" id="count-${album.id}">
                        <i class="fa fa-circle-notch fa-spin me-1" style="font-size:.6rem;"></i> Loading...
                    </span>
                </div>
            </div>
        </div>`
    ).join('');

    await Promise.all(ALBUMS.map(async album => {
        try {
            const resources = await fetchTag(album.tag);
            const countEl   = document.getElementById(`count-${album.id}`);
            const thumbEl   = document.getElementById(`thumb-${album.id}`);

            if (resources.length > 0) {
                const cover = resources[0];
                const coverThumb = `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/w_600,h_200,c_fill,f_auto,q_auto/v${cover.version}/${cover.public_id}.${cover.format}`;
                thumbEl.outerHTML = `<img src="${coverThumb}" alt="${album.title}" class="album-thumb" loading="lazy">`;

                countEl.className = 'album-count-badge badge-loaded';
                countEl.textContent = `${resources.length} photo${resources.length !== 1 ? 's' : ''}`;
            } else {
                countEl.className = 'album-count-badge badge-empty';
                countEl.textContent = 'Coming soon';
            }
        } catch(e) {
            const countEl = document.getElementById(`count-${album.id}`);
            if (countEl) {
                countEl.className = 'album-count-badge badge-empty';
                countEl.textContent = 'Unavailable';
            }
        }
    }));
}

async function openAlbum(albumId) {
    const config = ALBUMS.find(a => a.id === albumId);
    if (!config) return;

    document.getElementById('view-albums').style.display = 'none';
    document.getElementById('view-photos').style.display = '';
    document.getElementById('album-view-title').textContent = config.title;
    document.getElementById('album-view-desc').textContent  = config.description;
    document.getElementById('breadcrumb-label').textContent = config.title;
    document.getElementById('album-view-count').textContent = '...';

    document.getElementById('photos-grid').innerHTML = `
        <div style="grid-column:1/-1;text-align:center;padding:3rem 0;">
            <div class="mini-spinner"></div>
            <div class="text-muted small">Loading photos...</div>
        </div>`;

    window.scrollTo({ top: 0, behavior: 'smooth' });

    try {
        const resources = await fetchTag(config.tag);
        currentAlbum = { ...config, resources };

        document.getElementById('album-view-count').textContent =
            `${resources.length} photo${resources.length !== 1 ? 's' : ''}`;

        renderPhotoGrid(resources);
    } catch(e) {
        document.getElementById('photos-grid').innerHTML = `
            <div style="grid-column:1/-1;text-align:center;padding:3rem 0;">
                <i class="fa fa-exclamation-circle fa-3x mb-3 d-block" style="color:#dde3ef;"></i>
                <h5 class="text-muted">Could not load photos</h5>
                <p class="small text-muted">${e.message}</p>
            </div>`;
    }
}

function renderPhotoGrid(resources) {
    const grid = document.getElementById('photos-grid');

    if (!resources.length) {
        grid.innerHTML = `
            <div style="grid-column:1/-1;text-align:center;padding:3rem 0;">
                <i class="fa fa-images fa-3x mb-3 d-block" style="color:#dde3ef;"></i>
                <h5 class="text-muted">No photos yet</h5>
                <p class="small text-muted">Upload photos to Cloudinary with the tag
                   <strong>${currentAlbum.tag}</strong> and they'll appear here automatically.</p>
            </div>`;
        return;
    }

    grid.innerHTML = resources.map((img, i) => `
        <div class="photo-item" onclick="openLightbox(${i})">
            <img src="${thumbUrl(img)}" alt="" loading="lazy">
            <div class="photo-item-overlay">
                <i class="fa fa-expand"></i>
            </div>
        </div>`
    ).join('');
}

document.getElementById('back-btn').addEventListener('click', () => {
    document.getElementById('view-photos').style.display = 'none';
    document.getElementById('view-albums').style.display = '';
    document.getElementById('breadcrumb-label').textContent = 'Gallery';
    currentAlbum = null;
    history.pushState({}, '', window.location.pathname);
});

function openLightbox(index) {
    if (!currentAlbum?.resources?.length) return;
    lbIndex = index;
    document.getElementById('lightbox').classList.add('active');
    document.getElementById('lb-album-name').textContent = currentAlbum.title;
    renderLbThumbs();
    showLbPhoto();
    document.body.style.overflow = 'hidden';
}

function closeLightbox() {
    document.getElementById('lightbox').classList.remove('active');
    document.getElementById('lb-img').src = '';
    document.body.style.overflow = '';
}

function showLbPhoto() {
    const img  = currentAlbum.resources[lbIndex];
    const el   = document.getElementById('lb-img');
    el.style.opacity = '0';
    el.src = fullUrl(img);
    el.onload = () => { el.style.opacity = '1'; };
    document.getElementById('lb-counter').textContent =
        `${lbIndex + 1} / ${currentAlbum.resources.length}`;

    document.querySelectorAll('.lb-thumb-item').forEach((t, i) => {
        t.classList.toggle('active', i === lbIndex);
    });
    const active = document.querySelector('.lb-thumb-item.active');
    if (active) active.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
}

function renderLbThumbs() {
    document.getElementById('lb-thumbs').innerHTML =
        currentAlbum.resources.map((img, i) => `
            <img src="${thumbUrl(img)}"
                 class="lb-thumb-item${i === lbIndex ? ' active' : ''}"
                 onclick="lbIndex=${i};showLbPhoto();" loading="lazy">`
        ).join('');
}

function lbPrev() { lbIndex = (lbIndex - 1 + currentAlbum.resources.length) % currentAlbum.resources.length; showLbPhoto(); }
function lbNext() { lbIndex = (lbIndex + 1) % currentAlbum.resources.length; showLbPhoto(); }

document.getElementById('lb-close').addEventListener('click', closeLightbox);
document.getElementById('lb-prev').addEventListener('click', lbPrev);
document.getElementById('lb-next').addEventListener('click', lbNext);
document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('active')) return;
    if (e.key === 'ArrowLeft')  lbPrev();
    if (e.key === 'ArrowRight') lbNext();
    if (e.key === 'Escape')     closeLightbox();
});

const urlParams = new URLSearchParams(window.location.search);
const directAlbum = urlParams.get('album');
if (directAlbum && ALBUMS.find(a => a.id === directAlbum)) {
    document.getElementById('view-albums').style.display = 'none';
    openAlbum(directAlbum);
} else {
    renderAlbums();
}
</script>
</body>
</html>
